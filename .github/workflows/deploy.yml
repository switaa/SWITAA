name: Deploy Marcus

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 135.181.253.60
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -ex
            cd /root/marcus
            git fetch origin main
            git reset --hard origin/main
            git log --oneline -1
            cd infra
            docker compose build --no-cache backend 2>&1 | tail -20
            docker compose up -d --force-recreate backend 2>&1
            sleep 15
            docker compose logs --tail=30 backend 2>&1
            docker compose exec -T backend alembic upgrade head 2>&1 || true
            docker compose up -d --force-recreate frontend 2>&1
            echo "Deploy complete at $(date)"
